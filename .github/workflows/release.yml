name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # The release is created exactly once, here, and its id is handed to the
  # build matrix below. Letting each matrix job find-or-create the release
  # instead lets two jobs race and create two release objects for the same
  # tag, which silently splits the installers across them.
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.release_id }}
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Create draft release
        id: create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # workflow_dispatch has no tag, so fall back to the version in
          # tauri.conf.json rather than tagging the branch name.
          if [ "${{ github.ref_type }}" = "tag" ]; then
            tag="${{ github.ref_name }}"
          else
            tag="v$(sed -n 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' src-tauri/tauri.conf.json | head -1)"
          fi
          echo "Using tag: $tag"

          # The release body comes from RELEASE_NOTES.md, which is rewritten
          # for each version. Pasting it into the GitHub UI by hand was the one
          # manual step left in the release, and the one most likely to be
          # forgotten or done with the previous version's text.
          notes="See the assets below to download this version."
          if [ -f RELEASE_NOTES.md ]; then
            notes="$(cat RELEASE_NOTES.md)"

            # The notes are written before the tag exists, so nothing otherwise
            # ties the two together — shipping 0.4.0 with 0.3.1's text is a
            # quiet, entirely plausible mistake. Warn rather than fail: the
            # release is a draft that a human still has to publish, and the
            # annotation is right there on the run when they go to do it.
            version="${tag#v}"
            if ! grep -qF "$version" RELEASE_NOTES.md; then
              echo "::warning::RELEASE_NOTES.md does not mention $version — check it describes this release before publishing."
            fi
          else
            echo "::warning::No RELEASE_NOTES.md found; using placeholder body."
          fi

          # Reuse an existing draft for this tag if one is already there, so a
          # re-run does not add a second release alongside the first.
          id=$(gh api "repos/${{ github.repository }}/releases?per_page=100" \
                 --jq ".[] | select(.tag_name == \"$tag\") | .id" | head -1)

          if [ -z "$id" ]; then
            # Built with jq rather than repeated -f flags: the body is
            # multi-line markdown, and jq is what guarantees the quotes,
            # newlines and backticks in it survive as a single JSON string.
            id=$(jq -n \
                   --arg tag "$tag" \
                   --arg name "Rthoptera $tag" \
                   --arg body "$notes" \
                   '{tag_name:$tag, name:$name, body:$body, draft:true, prerelease:false}' \
                 | gh api --method POST "repos/${{ github.repository }}/releases" \
                     --input - --jq .id)
            echo "Created release $id with notes from RELEASE_NOTES.md"
          else
            # Deliberately left alone. A re-run reaching this branch means the
            # draft already exists, and its body may have been edited by hand
            # since; overwriting it would throw that away silently.
            echo "Reusing existing release $id — body left as it is."
          fi

          echo "release_id=$id" >> "$GITHUB_OUTPUT"

  build:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4.2.2

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Node
        uses: actions/setup-node@v4.4.0
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm install

      - name: Build and upload to the release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}
